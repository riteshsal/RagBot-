[project]
name = "rag-doc-qa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "riteshsal", email = "riteshsalve86@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "loguru>=0.7.3",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "uvicorn[standard]>=0.52.4",
]


[project.scripts]
rag-doc-qa = "rag-doc-qa:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"